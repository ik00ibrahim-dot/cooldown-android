<style>

:root{--bg:#f4f1ff;--b1:#ffd3ea;--b2:#c9e8ff;--card:rgba(255,255,255,.8);--solid:#fff;--ink:#1b1740;--mute:#6b6a94;--line:rgba(110,90,220,.15);--soft:rgba(124,92,255,.12);--ice:#6a5cff;--sess:#ff5d8f;--sc:#fff;--ok:#0fbf86;--on:#fff;--c1:#0a9be0;--c2:#7a54ff;--c3:#ef3f7d;--hg:linear-gradient(135deg,#7c5cff,#2f9bff 55%,#18d6b0)}@media(prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0a0820;--b1:rgba(255,61,119,.2);--b2:rgba(0,170,255,.18);--card:rgba(255,255,255,.06);--solid:#15112f;--ink:#f1edff;--mute:#a9a5d6;--line:rgba(255,255,255,.1);--soft:rgba(130,140,255,.16);--ice:#8b7dff;--sess:#ff7aa8;--sc:#fff;--ok:#3ddc9d;--on:#fff;--c1:#4cc9ff;--c2:#a58bff;--c3:#ff7aa8;--hg:linear-gradient(135deg,#5b3df5,#1769e0 55%,#0aa88f)}}:root[data-theme='dark']{--bg:#0a0820;--b1:rgba(255,61,119,.2);--b2:rgba(0,170,255,.18);--card:rgba(255,255,255,.06);--solid:#15112f;--ink:#f1edff;--mute:#a9a5d6;--line:rgba(255,255,255,.1);--soft:rgba(130,140,255,.16);--ice:#8b7dff;--sess:#ff7aa8;--sc:#fff;--ok:#3ddc9d;--on:#fff;--c1:#4cc9ff;--c2:#a58bff;--c3:#ff7aa8;--hg:linear-gradient(135deg,#5b3df5,#1769e0 55%,#0aa88f)}body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background-color:var(--bg);background-image:radial-gradient(60% 40% at 100% 0,var(--b1),transparent 70%),radial-gradient(55% 40% at 0 38%,var(--b2),transparent 70%);background-attachment:fixed}h1{font:800 34px/1 'Outfit',system-ui,sans-serif;letter-spacing:-.5px}.gt{background:linear-gradient(90deg,var(--c2),var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}.sub{font-size:14px}.card{background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;box-shadow:0 14px 34px -18px rgba(90,70,230,.4)}.hero{background:var(--hg);border:0;box-shadow:0 18px 40px -14px rgba(60,80,240,.6)}.hero .trk{stroke:rgba(255,255,255,.25)}.hero .bar{stroke:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}.hero .bar.ok{stroke:#c8ffe8}.hero .big{color:#fff}.hero .lbl,.hero .line{color:rgba(255,255,255,.88)}.hero .line b{color:#fff}.hero .btn{background:#fff;color:#4b3ff0;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}.big{font:800 60px/1 'Outfit',system-ui,sans-serif}.btn{background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;border-radius:18px;box-shadow:0 10px 22px -10px var(--c2)}.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}.step button{border:0;border-radius:50%;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-size:22px}.step input{border:0;border-radius:14px;background:var(--soft);color:var(--ink)}.stat{border-radius:22px;background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}.stat b{font:800 28px 'Outfit',system-ui,sans-serif}.stat:nth-child(1) b{color:var(--c1)}.stat:nth-child(2) b{color:var(--c2)}.stat:nth-child(3) b{color:var(--c3)}.ch button{border:0;border-radius:50%}.ch strong,.hist strong,.pane strong{font:700 18px 'Outfit',system-ui,sans-serif}.d{border-radius:14px;font-weight:600}.d.g{background:repeating-linear-gradient(135deg,rgba(40,190,255,.32) 0 5px,rgba(40,190,255,.13) 5px 9px)}.d.s{background:linear-gradient(135deg,#ff4f8b,#ff9a3d);color:#fff;font-weight:800;box-shadow:0 8px 16px -8px #ff4f8b}.d.u{box-shadow:inset 0 0 0 2px var(--ok),0 0 14px -2px var(--ok)}.d.x{outline:2px solid var(--c2)}.d b{top:-4px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:#fff;color:#e8336f;font-size:10px;line-height:16px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}.d em{position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%}.chip{font-weight:600}.chip.e{background:linear-gradient(135deg,#ff4f8b,#ff9a3d);color:#fff}.ttl{font:800 18px 'Outfit',system-ui,sans-serif}.lv{text-align:right;line-height:1}.lv span{font:800 44px 'Outfit',system-ui,sans-serif}.lv small{display:block;font-size:12px;color:var(--mute);margin-top:3px}.vol{display:flex;align-items:flex-end;gap:5px;height:68px;margin:14px 0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}.vb{flex:1;border-radius:7px;background:var(--soft);transition:background .12s,box-shadow .12s}.vb.on{background:var(--c);box-shadow:0 0 14px -3px var(--c)}.pl{margin-top:12px}.pr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.pr>span:first-child{flex:1}.pm{width:70px;height:7px;border-radius:4px;background:var(--soft);overflow:hidden}.pm i{display:block;height:100%}.pr em{font:800 14px 'Outfit',system-ui,sans-serif;width:18px;text-align:right}.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.seg button{border:0;border-radius:99px;padding:7px 13px;font:600 12px 'Outfit',system-ui,sans-serif;background:var(--soft);color:var(--mute);cursor:pointer}.seg button.on{background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff}.bars{display:flex;gap:3px;height:150px}.cb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}.cb span{font-size:10px;height:14px;color:var(--mute)}.bw{flex:1;width:100%;display:flex;align-items:flex-end}.bw i{display:block;width:100%;min-height:3px;border-radius:7px 7px 3px 3px}.cb u{text-decoration:none;font-size:10px;height:14px;margin-top:3px;color:var(--mute)}.pane{background:var(--solid)}.sheet{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.dy{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin-top:12px}.dy.se{border-color:#ff5d8f}.dy.sp{border-color:#ffb02e}.dy.sg{border-color:#28beff}.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.dh b{font:700 15px 'Outfit',system-ui,sans-serif}.td{font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--c2),var(--c1));border-radius:99px;padding:2px 8px}.dbs{margin-left:auto;display:flex;gap:6px}.dbs em{font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;color:#fff}.dbs .b1{background:linear-gradient(135deg,#ff4f8b,#ff9a3d)}.dbs .b2{color:#1a1033}.dy p{margin:5px 0;font-size:14px}.app{padding-bottom:120px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}.ni{max-width:460px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:26px;background:var(--solid);border:1px solid var(--line);box-shadow:0 12px 30px -10px rgba(60,40,200,.45);pointer-events:auto}.ni button{flex:1;border:0;background:transparent;color:var(--mute);border-radius:20px;padding:7px 0 6px;font:600 11px 'Outfit',system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.ni button i{font-style:normal;font-size:19px}.ni button.on{background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff}.tg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}.tgb{border:0;border-radius:99px;padding:6px 12px;font:600 12px 'Outfit',system-ui,sans-serif;background:var(--soft);color:var(--mute);cursor:pointer}.tgb.on{background:linear-gradient(135deg,#ff4f8b,#ff9a3d);color:#fff}.tgc{background:rgba(255,154,61,.25);margin:0 0 0 6px}.hb{display:grid;grid-template-columns:90px 1fr 28px;align-items:center;gap:8px;margin:7px 0;font-size:13px}.hb div{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}.hb i{display:block;height:100%;border-radius:6px}.hb b{text-align:right}.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:10px}.cmp b{display:block;font:800 30px 'Outfit',system-ui,sans-serif}.cmp span{font-size:11px;color:var(--mute)}.sub2{font-size:12px;color:var(--mute);margin:12px 0 2px;font-weight:600}.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;text-align:center}.gs b{display:block;font:800 42px 'Outfit',system-ui,sans-serif;background:linear-gradient(135deg,var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}.gs span{font-size:12px;color:var(--mute)}.bg <body>
<div class="app">
  <h1>❄️ <span class='gt'>Cooldown</span></h1>
  <div class="sub">Space it out. Stay in charge.</div>
  <div id="root"></div>
</div>
<div class="sheet" id="sh"><div class="pane"><strong>Log an entry</strong><input type="datetime-local" id="dt"><button class="btn" data-a="save">Save entry</button><button class="btn ghost" style="margin-top:8px" data-a="close">Cancel</button></div></div>
<nav class='nav' id='nav'><div class='ni'><button data-a='tab' data-v='home'><i>🏠</i>Home</button><button data-a='tab' data-v='cal'><i>📅</i>Calendar</button><button data-a='tab' data-v='ins'><i>📊</i>Insights</button><button data-a='tab' data-v='goal'><i>🏆</i>Goals</button><button data-a='tab' data-v='bk'><i>💾</i>Backup</button></div></nav><script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pk=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const dn=k=>{const[a,b,c]=k.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const add=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return key(d)};
const fd=(k,o)=>pk(k).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});
const ft=ts=>new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const nowTs=()=>{const n=new Date();return key(n)+'T'+pad(n.getHours())+':'+pad(n.getMinutes())};
const MN='January February March April May June July August September October November December'.split(' ');
let st={gap:3,s:[]};
try{const r=JSON.parse(localStorage.getItem('cooldown_v1')||'null');if(r&&Array.isArray(r.s))st=r}catch(e){}
function fix(){st.u=st.u||[];st.p=st.p||{on:false,every:2,start:'',max:0};st.bd=st.bd||[]}fix();const save=()=>{try{localStorage.setItem('cooldown_v1',JSON.stringify(st))}catch(e){}};
const T0=new Date();
let view={y:T0.getFullYear(),m:T0.getMonth()},sel=key(T0),arm=null;

function calc(){
  const s=[...st.s].sort((a,b)=>a.ts<b.ts?-1:1),se={},gd={},un={};
  s.forEach((x,i)=>{
    const d=x.ts.slice(0,10),nd=s[i+1]&&s[i+1].ts.slice(0,10),u=add(d,x.gap+1);
    (se[d]=se[d]||[]).push(x);
    for(let j=1;j<=x.gap;j++){const k=add(d,j);if(nd&&k>=nd)break;gd[k]={i:j,n:x.gap}}
    if(!nd||nd>=u)un[u]=1;
  });
  return{s,se,gd,un};
}
function hero(c){
  const t=key(new Date()),l=c.s[c.s.length-1];
  let big='–',lb='no entries yet',p=0,ok=false,ln='Set your gap below, then log your first entry.';
  if(l){
    const d=l.ts.slice(0,10),u=add(d,l.gap+1),left=dn(u)-dn(t);
    p=Math.max(0,Math.min(1,(dn(t)-dn(d))/(l.gap+1)));
    if(left>0){big=left;lb=left==1?'day to go':'days to go';ln='🔒 Next allowed: <b>'+fd(u)+'</b>'}
    else{big='✓';lb='gap complete';ok=true;ln='🔓 Allowed since <b>'+fd(u)+'</b>'}
  }
  return `<div class="card hero"><div class="rw"><svg class="ring" viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="bar${ok?' ok':''}" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="${(326.7*(1-p)).toFixed(1)}" transform="rotate(-90 60 60)"/></svg><div class="mid"><div class="big">${big}</div><div class="lbl">${lb}</div></div></div><div class="line">${ln}</div><button class="btn" data-a="log">+ Log an entry</button></div>`;
}
const gapCard=()=>`<div class="card"><div class="row"><div><strong>Gap between entries</strong><div class="note">Days in between. Change it anytime.${st.p.on?' Plan active: now '+eg()+'d.':''}</div></div><div class="step"><button data-a="gm">−</button><input id="gi" type="number" inputmode="numeric" min="1" max="90" value="${st.gap}"><button data-a="gp">+</button></div></div></div>`;
function stats(c){
  const t=key(new Date()),ds=c.s.map(x=>x.ts.slice(0,10)),g=[];
  for(let i=1;i<ds.length;i++)g.push(dn(ds[i])-dn(ds[i-1])-1);
  const since=ds.length?dn(t)-dn(ds[ds.length-1]):'–',
  avg=g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length*10)/10:'–',
  cnt=ds.filter(d=>d.slice(0,7)==t.slice(0,7)).length;
  return `<div class="stats"><div class="stat"><b>${since}</b><span>days since last</span></div><div class="stat"><b>${avg}</b><span>average gap</span></div><div class="stat"><b>${cnt}</b><span>this month</span></div></div>`;
}

let lvl=5,rng=14,met='e';function lvc(l){return 'hsl('+Math.round(130-l*12.5)+' 85% 55%)'}function dsc(l){return l<3?'Calm':l<5?'Mild':l<7?'Rising':l<9?'Strong':'Very high'}function pRow(x,dt){return `<div class='pr'><span>${dt?fd(x.ts.slice(0,10))+', ':'Pal at '}<b>${ft(x.ts)}</b>${tgc(x)}</span><span class='pm'><i style='width:${x.l*10}%;background:${lvc(x.l)}'></i></span><em>${x.l}</em><button class='x2${arm==x.id?' arm':''}' data-a='delp' data-id='${x.id}'>${arm==x.id?'Sure?':'✕'}</button></div>`}function paintLv(){document.querySelectorAll('.vb').forEach((b,i)=>b.classList.toggle('on',i<lvl));const n=$('#lvn');if(n){n.textContent=lvl;n.style.color=lvc(lvl);$('#lvd').textContent=dsc(lvl)}}function pal(){const bs=Array.from({length:10},(_,i)=>`<i class='vb${i<lvl?' on':''}' style='height:${16+i*5}px;--c:${lvc(i+1)}'></i>`).join('');const r=[...st.u].sort((a,b)=>a.ts<b.ts?1:-1).slice(0,4);return `<div class='card pal'><div class='row'><div><div class='ttl'>Pal Level</div><div class='note'>Drag the bar to match how strong it feels</div></div><div class='lv'><span id='lvn' style='color:${lvc(lvl)}'>${lvl}</span><small id='lvd'>${dsc(lvl)}</small></div></div><div class='vol'>${bs}</div><div class='tg'>${tagRow(ptag,'ptag')}</div><button class='btn' data-a='markp'>Mark Pal Level now</button>${r.length?`<div class='pl'>${r.map(x=>pRow(x,1)).join('')}</div>`:''}</div>`}function chart(c){const t=key(new Date()),ds=[];for(let i=rng-1;i>=0;i--)ds.push(add(t,-i));const pv=k=>Math.max(0,...st.u.filter(x=>x.ts.slice(0,10)==k).map(x=>x.l));const v=ds.map(k=>met=='e'?(c.se[k]||[]).length:pv(k)),mx=Math.max(met=='e'?3:10,...v),tot=v.reduce((a,b)=>a+b,0),multi=v.filter(x=>x>1).length;const bars=ds.map((k,i)=>`<div class='cb'><span>${v[i]||''}</span><div class='bw'><i style='height:${Math.max(v[i]/mx*100,2.5)}%;background:${met=='e'?'linear-gradient(180deg,#ff9a3d,#ff3d77)':lvc(v[i]||1)};opacity:${v[i]?1:.3}'></i></div><u>${rng<30||i%5==0||i==rng-1?pk(k).getDate():''}</u></div>`).join('');const sb=(cur,act,val,lab)=>`<button class='${cur==val?'on':''}' data-a='${act}' data-v='${val}'>${lab}</button>`;const note=met=='e'?`${tot} total in ${rng} days. Days with 2 or more entries: ${multi}`:`Highest Pal Level in this range: ${Math.max(0,...v)}/10`;return `<div class='card'><div class='ttl'>Daily chart</div><div class='seg'>${sb(met,'met','e','Entries')}${sb(met,'met','p','Pal Level')}<span style='flex:1'></span>${[7,14,30].map(n=>sb(rng,'rng',n,n+'d')).join('')}</div><div class='bars'>${bars}</div><div class='note' style='margin-top:8px'>${note}</div></div>`}let dd=14,tab='home',rarm=0,stag='',ptag='';const TAGS=['Boredom','Night','Stress','Lonely','Habit','Other'],BG=[3,7,14,30,60,90],BE=['🌱','🔥','⚡','🏅','👑','💎'];function tgc(x){return x.tg?`<span class='chip tgc'>${x.tg}</span>`:''}function tagRow(cur,act){return TAGS.map(t=>`<button class='tgb${cur==t?' on':''}' data-a='${act}' data-v='${t}'>${t}</button>`).join('')}function paintTags(){const e=$('#stg');if(e)e.innerHTML=tagRow(stag,'stag')}function eg(){const p=st.p;return st.gap+(p.on?Math.floor(Math.max(0,dn(key(new Date()))-dn(p.start))/(7*p.every)):0)}function streaks(c){const t=key(new Date()),d=c.s.map(x=>x.ts.slice(0,10)),cur=d.length?dn(t)-dn(d[d.length-1]):0;let best=cur;for(let i=1;i<d.length;i++)best=Math.max(best,dn(d[i])-dn(d[i-1]));return{cur,best}}function celebrate(t){const d=document.createElement('div'),C=['#ff4f8b','#ff9a3d','#ffd23f','#2ee59d','#28beff','#8b7dff'];d.className='cel';d.innerHTML=Array.from({length:40},(_,i)=>`<s style='left:${Math.random()*100}%;background:${C[i%6]};animation-delay:${Math.random()*.7}s;animation-duration:${1.8+Math.random()*1.5}s'></s>`).join('')+`<div class='cm'><div class='ce'>🏆</div><b>New badge unlocked!</b><span>${t}</span></div>`;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}function badgeCheck(c){const s=streaks(c),nb=BG.filter(n=>s.best>=n&&!st.bd.includes(n));if(nb.length){st.bd.push(...nb);
